<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XAUUSD Backtester</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="symbol">XAUUSD <small>Gold / US Dollar</small></div>
    <div class="price-line">
      <span id="livePrice">--</span>
      <span id="priceChange">--</span>
    </div>
    <div class="tf-group" id="tfGroup">
      <button class="tf-btn" data-tf="5m">5m</button>
      <button class="tf-btn" data-tf="15m">15m</button>
      <button class="tf-btn active" data-tf="30m">30m</button>
      <button class="tf-btn" data-tf="1h">1h</button>
      <button class="tf-btn" data-tf="4h">4h</button>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="resetBtn">⟲ Reset Chart</button>
    </div>
  </div>

  <div class="main">
    <div class="left-toolbar" id="toolbar">
      <button class="tool-btn active" data-tool="cursor" title="Cursor">↖</button>
      <div class="tool-divider"></div>
      <button class="tool-btn" data-tool="trend" title="Trend Line">╱</button>
      <button class="tool-btn" data-tool="hline" title="Horizontal Line">―</button>
      <div class="tool-divider"></div>
      <button class="tool-btn" data-tool="fib" title="Fibonacci Retracement">𝑓</button>
      <div class="tool-divider"></div>
      <button class="tool-btn" data-tool="high" title="Mark Swing High">H</button>
      <button class="tool-btn" data-tool="low" title="Mark Swing Low">L</button>
      <div class="tool-divider"></div>
      <button class="tool-btn" id="clearTool" title="Clear All Drawings">🗑</button>
    </div>

    <div class="chart-wrap">
      <div class="chart-canvas-area">
        <div class="indicator-chips">
          <div class="chip smc" id="chipSmc">SMC / ICT</div>
          <div class="chip session" id="chipSession">Session Zones</div>
        </div>
        <div id="chart"></div>
        <div class="hint" id="toolHint">Tool: Cursor</div>
      </div>

      <div class="bottom-bar">
        <button class="replay-btn" id="replayBtn">↻ Replay</button>
        <div class="replay-controls">
          <button class="play-icon-btn" id="playBtn">▶</button>
          <input type="range" class="replay-seek" id="seek" min="0" max="100" value="100" disabled>
        </div>
        <div class="speed-group">
          Speed:
          <select class="speed-select" id="speedSelect">
            <option value="800">0.5x</option>
            <option value="400" selected>1x</option>
            <option value="200">2x</option>
            <option value="80">5x</option>
            <option value="40">10x</option>
          </select>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel-section">
        <div class="panel-title">Indicators</div>
        <div class="ind-item" data-ind="smc"><span>SMC / ICT Swings</span><div class="ind-toggle" id="tgSmc"></div></div>
        <div class="ind-item" data-ind="session"><span>Session Zones</span><div class="ind-toggle" id="tgSession"></div></div>
      </div>

      <div class="trade-panel">
        <div class="trade-price-box">
          <div class="lbl">XAUUSD Market Price</div>
          <div class="val" id="tradePrice">--</div>
        </div>
        <div class="lot-row">
          <span>Lot Size</span>
          <input type="text" id="lotSize" value="0.10">
        </div>
        <div class="trade-btns">
          <button class="btn-sell" id="sellBtn">SELL<small id="sellPrice">--</small></button>
          <button class="btn-buy" id="buyBtn">BUY<small id="buyPrice">--</small></button>
        </div>
      </div>

      <div class="positions">
        <div class="pos-title">Open Positions</div>
        <div id="posList"></div>
      </div>
    </div>
  </div>

  <!-- module order matters: chart must exist before tools/indicators/replay/trading attach to it -->
  <script src="/js/api.js"></script>
  <script src="/js/chart.js"></script>
  <script src="/js/markers.js"></script>
  <script src="/js/tools.js"></script>
  <script src="/js/indicators.js"></script>
  <script src="/js/price.js"></script>
  <script src="/js/replay.js"></script>
  <script src="/js/trading.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
